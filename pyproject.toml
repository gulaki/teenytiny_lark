[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teenytiny-lark"
version = "0.1.0"
description = "Extensible Teeny Tiny compiler implemented with Python and Lark"
requires-python = ">=3.10"
dependencies = ["lark>=1.1,<2"]

[project.scripts]
ttc = "teenytiny.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["teenytiny*"]

[tool.setuptools.package-data]
teenytiny = ["grammar/*.lark"]
